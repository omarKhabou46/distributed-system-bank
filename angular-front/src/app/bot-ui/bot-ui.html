<div class="container py-3">

  <form
    [formGroup]="askForm"
    (ngSubmit)="askStream()"
    class="d-flex align-items-center gap-2 p-3"
  >
    <input
      type="text"
      formControlName="question"
      placeholder="Ask something..."
      class="form-control rounded-3 py-2 shadow-sm"
    />

    <button
      type="submit"
      class="btn btn-info text-white px-4 py-2 rounded-3 shadow-sm ask-btn"
    >
      Ask
    </button>
  </form>

  <div class="response-box mt-3 p-4 rounded-3 shadow-sm">

    @if (isLoading()) {
      <div class="d-flex flex-column align-items-center gap-2 py-3">
        <div class="spinner-border text-info" role="status">
          <span class="visually-hidden">Loading...</span>
        </div>
        <span class="text-secondary small">Generating response...</span>
      </div>
    } @else {
      @if (response()) {
        <div class="d-flex align-items-start gap-2">
          <i class="bi bi-robot text-info fs-4"></i>
          <div class="response-text">
            <markdown [data]="response()" ></markdown>
          </div>
        </div>
      } @else {
        <p class="text-muted text-center mb-0">
          Ask a question to get started.
        </p>
      }
    }

  </div>

</div>
