<div class="p-2">

  <form [formGroup]="askForm" (ngSubmit)="ask()"
        class="flex items-center gap-2 p-4">

    <input
      type="text"
      formControlName="question"
      placeholder="Ask something..."
      class="flex-1 rounded-lg border border-gray-300 px-2 py-2
           outline-none focus:border-blue-500"
    />

    <button
      type="submit"
      class="rounded-lg bg-blue-600 px-5 py-2 text-black
           hover:bg-blue-700"
    >
      Ask
    </button>
  </form>

  <div>
    {{response()}}
  </div>
</div>
