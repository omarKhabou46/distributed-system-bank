spring:
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: customer-service
            - uri: http://localhost:8056/api/customer-service
            - predicates:
                - Path = /api/customer-service/**
            - id: bank-service
            - uri: http://localhost:8057/api/bank-account-service
            - predicates:
                - Path = /api/bank-account-service/**
